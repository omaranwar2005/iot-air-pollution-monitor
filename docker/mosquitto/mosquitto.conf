# Mosquitto MQTT Broker Configuration
# IoT Air Pollution Monitor System

# Listener for standard MQTT (port 1883)
listener 1883
protocol mqtt

# Listener for MQTT over WebSockets (port 9001)
listener 9001
protocol websockets

# Allow anonymous connections (set to false in production)
allow_anonymous false

# Password file for authentication
password_file /mosquitto/config/passwd

# Persistence
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# Connection settings
max_connections 100
max_keepalive 120

# Message size limit (bytes)
message_size_limit 65536
